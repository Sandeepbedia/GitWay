# Sanity check for every push/PR to main: does the app still compile? This does not
# publish anything — see release.yml for the tag-triggered release build.
name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify GPL-3.0 license headers
        run: |
          MISSING=$(grep -rL "GNU General Public License" app/src --include="*.kt" || true)
          if [ -n "$MISSING" ]; then
            echo "Files missing GPL-3.0 header:"; echo "$MISSING"; exit 1
          fi
          echo "All $(find app/src -name '*.kt' | wc -l) Kotlin files carry the GPL-3.0 header."

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
