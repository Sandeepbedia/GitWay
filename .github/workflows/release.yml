# Builds the release APK and publishes a GitHub Release with it attached,
# automatically, whenever a version tag is pushed.
#
# Trigger:
#   git tag v1.0
#   git push origin v1.0
#
# That's it — this workflow does what you'd otherwise do by hand on
# https://github.com/Sandeepbedia/GitWay/releases/new, including uploading the APK.
#
# Signing (optional but recommended):
#   Without any secrets configured, this still builds and publishes an UNSIGNED
#   release APK (app/build.gradle.kts already supports that — it detects the
#   keystore folder and falls back to unsigned builds when missing). To get a
#   properly signed APK instead, add these four repository secrets
#   (Settings -> Secrets and variables -> Actions):
#     KEYSTORE_BASE64     base64 of your .jks/.keystore file — generate with:
#                         base64 -w0 your-release-key.jks   (Linux/macOS)
#                         certutil -encode your-release-key.jks tmp.b64  (Windows)
#     KEYSTORE_PASSWORD   the keystore's store password
#     KEY_ALIAS           the key alias inside the keystore
#     KEY_PASSWORD        the key's password
#
# The signing secrets are written to $AB_KEYSTORE_DIR/config.properties and the
# keystore JKS placed in the same folder — app/build.gradle.kts reads exactly
# this layout, so no project file is modified by the workflow.
name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          AB_KEYSTORE_DIR: /tmp/universal-keystore
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$AB_KEYSTORE_DIR"
          echo "$KEYSTORE_BASE64" | base64 -d > "$AB_KEYSTORE_DIR/release.jks"
          cat > "$AB_KEYSTORE_DIR/config.properties" <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        env:
          AB_KEYSTORE_DIR: /tmp/universal-keystore
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate and rename APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          OUT_NAME="GitWay-${{ github.ref_name }}.apk"
          cp "$APK_PATH" "$OUT_NAME"
          echo "path=$OUT_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Git Way ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
