# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.code.style=official
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Kotlin compile daemon. AGP 9 compiles Kotlin itself; without a heap bump the
# default daemon heap is small and compileDebugKotlin crawls on a phone.
kotlin.daemon.jvmargs=-Xmx1536m -XX:+UseParallelGC
org.gradle.parallel=true
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.country=US
systemProp.user.language=en
# aapt2 shipped inside the PhoneIDE proot, not the one AGP pulls from Google
# Maven — the previous /data/data/com.jahangir/... path belonged to a different
# install of the app and does not exist in the current one.
android.aapt2FromMavenOverride=/usr/bin/aapt2
