<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 260"
     width="200"
     height="260">

  <defs>
    <clipPath id="clip-responsive-views">
      <rect x="25" y="72"
            width="150" height="96"
            rx="18" ry="18"/>
    </clipPath>

    <linearGradient id="responsive-green"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#66E39A"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
  </defs>

  <!-- Main Responsive Preview -->
  <rect
    x="25" y="72"
    width="150" height="96"
    rx="18"
    fill="#302D38"/>

  <g clip-path="url(#clip-responsive-views)">

    <!-- Sidebar -->
    <rect
      x="25" y="72"
      width="46" height="96"
      fill="#E0F2E5"/>

    <!-- Profile -->
    <circle
      cx="48"
      cy="87"
      r="7"
      fill="#2E7D32"/>

    <!-- Sidebar Header -->
    <rect
      x="36" y="99"
      width="24"
      height="2.5"
      rx="1.25"
      fill="#2E7D32"/>

    <!-- Sidebar Items -->
    <circle cx="36" cy="114" r="1.5" fill="#4B7654"/>
    <line x1="42" y1="114" x2="58" y2="114"
          stroke="#4B7654"
          stroke-width="2"
          stroke-linecap="round"/>

    <circle cx="36" cy="124" r="1.5" fill="#4B7654"/>
    <line x1="42" y1="124" x2="58" y2="124"
          stroke="#4B7654"
          stroke-width="2"
          stroke-linecap="round"/>

    <circle cx="36" cy="134" r="1.5" fill="#4B7654"/>
    <line x1="42" y1="134" x2="58" y2="134"
          stroke="#4B7654"
          stroke-width="2"
          stroke-linecap="round"/>

    <!-- Responsive Grid -->
    <rect x="78" y="79"
          width="38" height="38"
          rx="7"
          fill="url(#responsive-green)"/>

    <rect x="120" y="79"
          width="38" height="38"
          rx="7"
          fill="#43A047"/>

    <rect x="78" y="121"
          width="38" height="38"
          rx="7"
          fill="#43A047"/>

    <rect x="120" y="121"
          width="38" height="38"
          rx="7"
          fill="#34A853"/>

    <!-- Responsive Diagonal -->
    <line
      x1="85"
      y1="152"
      x2="151"
      y2="86"
      stroke="#FFFFFF"
      stroke-width="2"
      stroke-linecap="round"
      opacity="0.95"/>

    <!-- Bottom-left Resize Corner -->
    <polyline
      points="93,152 85,152 85,144"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- Top-right Resize Corner -->
    <polyline
      points="143,86 151,86 151,94"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- Add Button -->
    <circle
      cx="150"
      cy="151"
      r="8.5"
      fill="#B8F7D8"/>

    <path
      d="M150 147V155M146 151H154"
      stroke="#24563A"
      stroke-width="1.8"
      stroke-linecap="round"/>

  </g>

  <!-- Outer Border -->
  <rect
    x="25.5" y="72.5"
    width="149" height="95"
    rx="17.5"
    fill="none"
    stroke="#49454F"
    stroke-width="1"/>

</svg>