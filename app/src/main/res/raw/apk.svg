<svg xmlns="http://www.w3.org/2000/svg"
     width="32"
     height="32"
     viewBox="0 0 32 32">

  <!-- Material 3 Android Studio Style -->

  <!-- Main Surface -->
  <rect
    x="3"
    y="4"
    width="26"
    height="24"
    rx="6"
    fill="#D0BCFF"/>

  <!-- Top Toolbar -->
  <path
    d="M3 10
       H29
       V10
       C29 6.7 26.3 4 23 4
       H9
       C5.7 4 3 6.7 3 10Z"
    fill="#6750A4"/>

  <!-- Android Head -->
  <path
    d="M10 10.5
       C10.4 7.9 12.8 6.2 16 6.2
       C19.2 6.2 21.6 7.9 22 10.5
       V12.5
       H10Z"
    fill="#FFFFFF"/>

  <!-- Antennas -->
  <path
    d="M12.5 7.8L11.2 5.8
       M19.5 7.8L20.8 5.8"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1.1"
    stroke-linecap="round"/>

  <!-- Android Eyes -->
  <circle cx="13.4" cy="9.4" r="0.7" fill="#6750A4"/>
  <circle cx="18.6" cy="9.4" r="0.7" fill="#6750A4"/>

  <!-- Studio / Build Symbol -->
  <path
    d="M9 16
       L12 13
       L15 16
       L12 19
       Z"
    fill="#FFB300"/>

  <path
    d="M17 13
       H23
       C23.6 13 24 13.4 24 14
       V19
       C24 19.6 23.6 20 23 20
       H17
       C16.4 20 16 19.6 16 19
       V14
       C16 13.4 16.4 13 17 13Z"
    fill="#FFFFFF"
    opacity="0.95"/>

  <!-- Code Brackets -->
  <path
    d="M18.5 15L17 16.5L18.5 18"
    fill="none"
    stroke="#6750A4"
    stroke-width="1.1"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <path
    d="M21.5 15L23 16.5L21.5 18"
    fill="none"
    stroke="#6750A4"
    stroke-width="1.1"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Material 3 Bottom Accent -->
  <rect
    x="8"
    y="22"
    width="16"
    height="2.5"
    rx="1.25"
    fill="#7D5260"/>

</svg>