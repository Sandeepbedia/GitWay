<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 260"
     width="200"
     height="260">

  <defs>
    <clipPath id="clip-empty-views">
      <rect
        x="30"
        y="20"
        width="140"
        height="220"
        rx="24"
        ry="24"/>
    </clipPath>
  </defs>

  <!-- Main Background -->
  <rect
    x="30"
    y="20"
    width="140"
    height="220"
    rx="24"
    fill="#302D38"/>

  <g clip-path="url(#clip-empty-views)">

    <!-- Top Bar -->
    <rect
      x="30"
      y="20"
      width="140"
      height="44"
      fill="#43A047"/>

    <!-- Back Button Circle -->
    <circle
      cx="52"
      cy="42"
      r="14"
      fill="#388E3C"/>

    <!-- Back Arrow -->
    <path
      d="M57 42H47M51.5 36.5L46 42L51.5 47.5"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- More Button -->
    <circle
      cx="150"
      cy="36"
      r="1.7"
      fill="#FFFFFF"/>

    <circle
      cx="150"
      cy="42"
      r="1.7"
      fill="#FFFFFF"/>

    <circle
      cx="150"
      cy="48"
      r="1.7"
      fill="#FFFFFF"/>

    <!-- Empty Content Accent -->
    <circle
      cx="100"
      cy="140"
      r="28"
      fill="#3A3542"/>

    <path
      d="M88 140
         C88 133.4 93.4 128 100 128
         C106.6 128 112 133.4 112 140
         C112 146.6 106.6 152 100 152
         C93.4 152 88 146.6 88 140Z"
      fill="#4A4452"/>

  </g>

  <!-- Outer Border -->
  <rect
    x="30.5"
    y="20.5"
    width="139"
    height="219"
    rx="23.5"
    fill="none"
    stroke="#49454F"
    stroke-width="1"/>

</svg>