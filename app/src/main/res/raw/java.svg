<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="32"
     height="32"
     viewBox="0 0 32 32">

  <defs>

    <!-- Clean Premium Background -->
    <linearGradient id="bg"
                    x1="2" y1="2"
                    x2="30" y2="30">
      <stop offset="0%" stop-color="#241713"/>
      <stop offset="100%" stop-color="#080605"/>
    </linearGradient>

    <!-- Java Red -->
    <linearGradient id="red"
                    x1="7" y1="25"
                    x2="25" y2="7">
      <stop offset="0%" stop-color="#C62828"/>
      <stop offset="55%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#FF6659"/>
    </linearGradient>

    <!-- Java Orange -->
    <linearGradient id="orange"
                    x1="8" y1="25"
                    x2="24" y2="8">
      <stop offset="0%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">
      <feDropShadow
          dx="0"
          dy="1.5"
          stdDeviation="1.5"
          flood-color="#000000"
          flood-opacity=".5"/>
    </filter>

  </defs>


  <!-- Background -->
  <rect x="1"
        y="1"
        width="30"
        height="30"
        rx="7"
        fill="url(#bg)"/>


  <!-- Subtle Border -->
  <rect x="1.5"
        y="1.5"
        width="29"
        height="29"
        rx="6.5"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity=".10"
        stroke-width=".7"/>


  <!-- Java Cup -->
  <g filter="url(#shadow)">

    <!-- Steam -->
    <path
        d="M13 8
           C10.8 6.4 13.2 5.4 12.7 4
           C12.3 3.1 11.5 2.7 11 2.4"
        fill="none"
        stroke="#FFB74D"
        stroke-width="1.4"
        stroke-linecap="round"/>

    <path
        d="M16 8
           C13.8 6.2 16.5 5.1 15.8 3.5
           C15.4 2.7 14.7 2.3 14.3 2"
        fill="none"
        stroke="#FFCC80"
        stroke-width="1.4"
        stroke-linecap="round"/>

    <path
        d="M19 8
           C17 6.4 19.5 5.2 18.8 3.8
           C18.5 3 17.8 2.6 17.5 2.3"
        fill="none"
        stroke="#FFB74D"
        stroke-width="1.3"
        stroke-linecap="round"/>


    <!-- Cup -->
    <path
        d="M7 11
           H22
           L20.5 19
           C20.1 21.3 18.2 23 15.8 23
           H13.2
           C10.8 23 8.9 21.3 8.5 19
           Z"
        fill="url(#red)"/>


    <!-- Coffee -->
    <ellipse
        cx="14.5"
        cy="11"
        rx="7.5"
        ry="2"
        fill="#8E241F"/>

    <ellipse
        cx="14.5"
        cy="10.7"
        rx="6"
        ry="1.2"
        fill="#4E1714"/>


    <!-- Handle -->
    <path
        d="M21 13
           H23
           C25 13 26 14.2 26 16
           C26 18.2 24.5 19.5 21.5 19.5
           H20.8
           L21.2 17.8
           H22
           C23.3 17.8 24 17.2 24 16
           C24 15.2 23.5 14.7 22.5 14.7
           H21.3
           Z"
        fill="url(#orange)"/>


    <!-- Cup Highlight -->
    <path
        d="M9.5 13
           L10.8 19
           C11 20 11.5 20.7 12.3 21.2"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity=".18"
        stroke-width="1"
        stroke-linecap="round"/>


    <!-- Saucer -->
    <path
        d="M7 24
           C10 26 20 26 23 24"
        fill="none"
        stroke="url(#orange)"
        stroke-width="2"
        stroke-linecap="round"/>

  </g>


  <!-- Small Highlight -->
  <path
      d="M8 11.5
         H20"
      stroke="#FFFFFF"
      stroke-opacity=".12"
      stroke-width=".6"
      stroke-linecap="round"/>

</svg>