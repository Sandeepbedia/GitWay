<svg xmlns="http://www.w3.org/2000/svg"
     width="128"
     height="128"
     viewBox="0 0 128 128">

  <defs>
    <linearGradient id="jpgGradient"
                    x1="18"
                    y1="15"
                    x2="110"
                    y2="115"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6750A4"/>
      <stop offset="1" stop-color="#4F378B"/>
    </linearGradient>

    <filter id="shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="3"
        flood-color="#000000"
        flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Image Frame -->
  <rect
    x="18"
    y="16"
    width="92"
    height="96"
    rx="12"
    fill="none"
    stroke="url(#jpgGradient)"
    stroke-width="8"
    filter="url(#shadow)"/>

  <!-- Sun -->
  <circle
    cx="84"
    cy="42"
    r="9"
    fill="#FFB300"/>

  <!-- Mountains -->
  <path
    d="M25 100
       L48 68
       L61 83
       L75 63
       L103 100
       Z"
    fill="#6750A4"/>

  <!-- Mountain Highlight -->
  <path
    d="M48 68
       L61 83
       L55 77
       L43 92
       L35 100
       H25
       Z"
    fill="#D0BCFF"/>

</svg>