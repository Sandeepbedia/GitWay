<svg xmlns="http://www.w3.org/2000/svg"
     width="32"
     height="32"
     viewBox="0 0 32 32">

  <!-- Terminal -->
  <rect
    x="4"
    y="6"
    width="24"
    height="20"
    rx="5"
    fill="#263238"/>

  <!-- Bash Prompt -->
  <path
    d="M9 11L14 16L9 21"
