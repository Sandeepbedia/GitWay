<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 260"
     width="200"
     height="260">

  <defs>
    <clipPath id="clip-nav-drawer">
      <rect x="30" y="20"
            width="140" height="220"
            rx="24" ry="24"/>
    </clipPath>
  </defs>

  <!-- Phone Background -->
  <rect
    x="30" y="20"
    width="140" height="220"
    rx="24"
    fill="#29272E"/>

  <g clip-path="url(#clip-nav-drawer)">

    <!-- Top Toolbar -->
    <rect
      x="30" y="20"
      width="140" height="44"
      fill="#43A047"/>

    <!-- Hamburger -->
    <path
      d="M45 35H61M45 42H61M45 49H61"
      stroke="#FFFFFF"
      stroke-width="2.2"
      stroke-linecap="round"/>

    <!-- More Menu -->
    <circle cx="151" cy="36" r="1.7" fill="#FFFFFF"/>
    <circle cx="151" cy="42" r="1.7" fill="#FFFFFF"/>
    <circle cx="151" cy="48" r="1.7" fill="#FFFFFF"/>

    <!-- Content -->
    <rect
      x="30" y="64"
      width="140"
      height="176"
      fill="#35313D"/>

    <!-- Scrim -->
    <rect
      x="122" y="64"
      width="48"
      height="176"
      fill="#000000"
      opacity="0.42"/>

    <!-- Navigation Drawer -->
    <rect
      x="30" y="20"
      width="94"
      height="220"
      rx="0"
      fill="#F5F0FA"/>

    <!-- Drawer Header -->
    <rect
      x="30" y="20"
      width="94"
      height="60"
      fill="#43A047"/>

    <!-- Profile -->
    <circle
      cx="52"
      cy="42"
      r="10"
      fill="#FFFFFF"
      opacity="0.95"/>

    <!-- Header Text -->
    <rect
      x="42"
      y="59"
      width="48"
      height="3.5"
      rx="1.75"
      fill="#FFFFFF"/>

    <rect
      x="42"
      y="67"
      width="32"
      height="2.5"
      rx="1.25"
      fill="#FFFFFF"
      opacity="0.72"/>

    <!-- Selected Item -->
    <rect
      x="36"
      y="88"
      width="82"
      height="20"
      rx="10"
      fill="#C8E6C9"/>

    <!-- Item 1 -->
    <circle
      cx="48"
      cy="98"
      r="3"
      fill="#2E7D32"/>

    <rect
      x="57"
      y="96"
      width="43"
      height="4"
      rx="2"
      fill="#2E7D32"/>

    <!-- Item 2 -->
    <circle
      cx="48"
      cy="122"
      r="3"
      fill="#5F6368"/>

    <rect
      x="57"
      y="120"
      width="38"
      height="4"
      rx="2"
      fill="#5F6368"/>

    <!-- Item 3 -->
    <circle
      cx="48"
      cy="140"
      r="3"
      fill="#5F6368"/>

    <rect
      x="57"
      y="138"
      width="45"
      height="4"
      rx="2"
      fill="#5F6368"/>

    <!-- Item 4 -->
    <circle
      cx="48"
      cy="158"
      r="3"
      fill="#5F6368"/>

    <rect
      x="57"
      y="156"
      width="36"
      height="4"
      rx="2"
      fill="#5F6368"/>

  </g>

  <!-- Phone Border -->
  <rect
    x="30.5" y="20.5"
    width="139" height="219"
    rx="23.5"
    fill="none"
    stroke="#49454F"
    stroke-width="1"/>

</svg>