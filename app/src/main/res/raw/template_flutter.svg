<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 260"
     width="200"
     height="260">

  <defs>
    <clipPath id="phone-flutter">
      <rect x="30" y="20"
            width="140" height="220"
            rx="24"/>
    </clipPath>

    <linearGradient id="flutterBlue"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#69D5FF"/>
      <stop offset="55%" stop-color="#40C4FF"/>
      <stop offset="100%" stop-color="#03A9F4"/>
    </linearGradient>
  </defs>

  <!-- Phone Background -->
  <rect
    x="30"
    y="20"
    width="140"
    height="220"
    rx="24"
    fill="#29272E"/>

  <g clip-path="url(#phone-flutter)">

    <!-- Flutter-style Mark -->
    <g transform="translate(64 91) scale(1.55)">

      <!-- Main diagonal -->
      <polygon
        points="26,4 6,24 12,30 38,4"
        fill="url(#flutterBlue)"/>

      <!-- Middle diagonal -->
      <polygon
        points="38,22 27,33 21,27 26,22"
        fill="#40C4FF"/>

      <!-- Center diamond -->
      <polygon
        points="21,27 27,33 21,39 15,33"
        fill="#03A9F4"/>

      <!-- Bottom section -->
      <polygon
        points="38,44 26,44 21,39 27,33"
        fill="#0288D1"/>

      <!-- Bottom highlight -->
      <polygon
        points="21,39 30,36 27,33"
        fill="#01579B"/>

    </g>

  </g>

  <!-- Phone Border -->
  <rect
    x="30.5"
    y="20.5"
    width="139"
    height="219"
    rx="23.5"
    fill="none"
    stroke="#49454F"
    stroke-width="1"/>

</svg>