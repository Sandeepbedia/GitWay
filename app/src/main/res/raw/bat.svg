<svg xmlns="http://www.w3.org/2000/svg"
     width="32"
     height="32"
     viewBox="0 0 32 32">

  <!-- Command Prompt -->
  <rect
    x="3.5"
    y="5"
    width="25"
    height="22"
    rx="5"
    fill="#1E2A30"/>

  <!-- Windows-style Header -->
  <circle cx="8.5" cy="8.5" r="1.1" fill="#4FC3F7"/>
  <circle cx="12.5" cy="8.5" r="1.1" fill="#4FC3F7"/>
  <circle cx="16.5" cy="8.5" r="1.1" fill="#4FC3F7"/>

  <!-- Prompt -->
  <path
    d="M8.5 13L13.5 17L8.5 21"
    fill="none"
    stroke="#64B5F6"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Batch Command -->
  <path
    d="M16 21H23"
    fill="none"
    stroke="#81C784"
    stroke-width="2"
    stroke-linecap="round"/>

  <!-- BAT Accent -->
  <rect
    x="16"
    y="13"
    width="7"
    height="2.5"
    rx="1.25"
    fill="#81C784"/>

  <!-- Subtle Border -->
  <rect
    x="4"
    y="5.5"
    width="24"
    height="21"
    rx="4.5"
    fill="none"
    stroke="#455A64"
    stroke-width="1"/>

</svg>