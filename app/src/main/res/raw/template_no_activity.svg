<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 260"
     width="200"
     height="260">

  <defs>
    <clipPath id="phone-screen-no-activity">
      <rect
        x="30"
        y="20"
        width="140"
        height="220"
        rx="24"
        ry="24"/>
    </clipPath>
  </defs>

  <!-- Phone Background -->
  <rect
    x="30"
    y="20"
    width="140"
    height="220"
    rx="24"
    fill="#29272E"/>

  <g clip-path="url(#phone-screen-no-activity)">

    <!-- Soft Empty State Background -->
    <rect
      x="30"
      y="20"
      width="140"
      height="220"
      fill="#302D38"/>

    <!-- Subtle Glow -->
    <circle
      cx="100"
      cy="130"
      r="42"
      fill="#35313D"/>

    <!-- No Activity Icon -->
    <g transform="translate(100 130)">

      <!-- Outer Ring -->
      <circle
        cx="0"
        cy="0"
        r="28"
        fill="none"
        stroke="#B9B1C5"
        stroke-width="4.5"/>

      <!-- Diagonal Slash -->
      <line
        x1="-19.8"
        y1="-19.8"
        x2="19.8"
        y2="19.8"
        stroke="#B9B1C5"
        stroke-width="4.5"
        stroke-linecap="round"/>

    </g>

  </g>

  <!-- Phone Border -->
  <rect
    x="30.5"
    y="20.5"
    width="139"
    height="219"
    rx="23.5"
    fill="none"
    stroke="#49454F"
    stroke-width="1"/>

</svg>