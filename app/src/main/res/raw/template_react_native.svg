<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 260"
     width="100%"
     height="100%">

  <defs>
    <clipPath id="phone-screen-react">
      <rect
        x="30"
        y="20"
        width="140"
        height="220"
        rx="24"
        ry="24"/>
    </clipPath>

    <linearGradient
      id="react-blue"
      x1="0"
      y1="0"
      x2="1"
      y2="1">
      <stop offset="0%" stop-color="#80E7FF"/>
      <stop offset="50%" stop-color="#61DAFB"/>
      <stop offset="100%" stop-color="#21B8E6"/>
    </linearGradient>
  </defs>

  <!-- Phone Background -->
  <rect
    x="30"
    y="20"
    width="140"
    height="220"
    rx="24"
    fill="#29272E"/>

  <g clip-path="url(#phone-screen-react)">

    <!-- Screen -->
    <rect
      x="30"
      y="20"
      width="140"
      height="220"
      fill="#302D38"/>

    <!-- Soft Glow -->
    <circle
      cx="100"
      cy="130"
      r="48"
      fill="#35313D"/>

    <!-- React-style Orbit Mark -->
    <g
      transform="translate(100 130)"
      fill="none"
      stroke="url(#react-blue)"
      stroke-width="4"
      stroke-linecap="round">

      <!-- Horizontal Orbit -->
      <ellipse
        rx="42"
        ry="16"/>

      <!-- Diagonal Orbit -->
      <ellipse
        rx="42"
        ry="16"
        transform="rotate(60)"/>

      <!-- Diagonal Orbit -->
      <ellipse
        rx="42"
        ry="16"
        transform="rotate(120)"/>

    </g>

    <!-- Center -->
    <circle
      cx="100"
      cy="130"
      r="7"
      fill="#61DAFB"/>

    <circle
      cx="100"
      cy="130"
      r="3"
      fill="#D5F8FF"/>

  </g>

  <!-- Phone Border -->
  <rect
    x="30.5"
    y="20.5"
    width="139"
    height="219"
    rx="23.5"
    fill="none"
    stroke="#49454F"
    stroke-width="1"/>

</svg>