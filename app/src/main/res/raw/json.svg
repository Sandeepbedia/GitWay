<svg xmlns="http://www.w3.org/2000/svg"
     width="128"
     height="128"
     viewBox="0 0 128 128">

  <defs>
    <linearGradient id="jsonGradient"
                    x1="20"
                    y1="15"
                    x2="108"
                    y2="112"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6750A4"/>
      <stop offset="1" stop-color="#4F378B"/>
    </linearGradient>

    <filter id="shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="3"
        flood-color="#000000"
        flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- JSON Braces -->
  <g
    fill="none"
    stroke="url(#jsonGradient)"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#shadow)">

    <!-- Left Brace -->
    <path d="
      M43 22
      C34 22 30 28 30 37
      V47
      C30 54 27 58 21 64
      C27 70 30 74 30 81
      V91
      C30 100 34 106 43 106"/>

    <!-- Right Brace -->
    <path d="
      M85 22
      C94 22 98 28 98 37
      V47
      C98 54 101 58 107 64
      C101 70 98 74 98 81
      V91
      C98 100 94 106 85 106"/>

  </g>

  <!-- JSON Dots / Data -->
  <g fill="#FFB300">
    <circle cx="55" cy="48" r="4"/>
    <circle cx="73" cy="48" r="4"/>

    <circle cx="55" cy="64" r="4"/>
    <circle cx="73" cy="64" r="4"/>

    <circle cx="55" cy="80" r="4"/>
    <circle cx="73" cy="80" r="4"/>
  </g>

</svg>